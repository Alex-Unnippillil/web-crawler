name: Observatory validation
on:
  push:
    branches: ['studio/observatory-accessibility']
  pull_request:
    paths:
      - 'ui/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/observatory.yml'
permissions:
  contents: read
concurrency:
  group: observatory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only (no credentials or untracked files)
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: observatory-source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 3
