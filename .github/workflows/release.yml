# Repository note: Validates actual portable downloads before publishing; PR runs never publish.
name: Build portable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', 'scripts/package-portable.mjs', 'tests/portable_smoke.py', '.github/workflows/release.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', 'scripts/package-portable.mjs', 'tests/portable_smoke.py', '.github/workflows/release.yml']
permissions:
  contents: read
concurrency:
  group: portable-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_BROWSER: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_required: ${{ steps.version.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == 'pull_request' ]]; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate all crawl modes and real GUI workflows
        if: steps.version.outputs.build_required == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          bash .github/prepare-browser-ci.sh
          python3 -m pip install playwright==1.63.0
          npm run check
          npm run demo
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/e2e.py
          python3 tests/hybrid_e2e.py
          python3 tests/glass_e2e.py
          python3 tests/observatory_e2e.py
  package:
    needs: validate
    if: needs.validate.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, linux-x64, darwin-arm64, darwin-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - run: npm run package:portable -- ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            release/Web-Crawler-Studio-*.zip
            release/Web-Crawler-Studio-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
  smoke:
    needs: [validate, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: downloads
      - run: python tests/portable_smoke.py downloads/Web-Crawler-Studio-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.zip
  publish:
    needs: [validate, package, smoke]
    # A PR can build and test archives but cannot create a tag or release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: downloads
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "v$VERSION" downloads/* \
            --target "${{ github.sha }}" \
            --title "Web Crawler Studio $VERSION" \
            --notes "Observatory workspace: editorial light/dark redesign, metadata radar, HTTP outcome bars, visit-duration histogram, discovery-depth stacked bars, complete page rankings and filterable evidence lists. Static accessibility heuristics, complete body-text fingerprints, repeated-title groups and captured failed-link source tracing. Adjustable text, high contrast, reduced motion and table-first charts improve usability without changing network policy. See README.md and docs/OBSERVATORY.md for definitions, denominators, limits and accessibility checks. Existing HTTP/Smart/Browser modes, Visual Atlas, custom extraction and owner-access controls remain available. Extract the matching portable ZIP and open the launcher. Node.js 24 and production dependencies are bundled; Chromium is an optional separate download. Community builds remain unsigned and not notarized. Verify the SHA-256 sidecar and follow OS security policy."
